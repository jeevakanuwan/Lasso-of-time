name: Build proofreading edition

on:
  push:
    branches:
      - iteration/proofreading-edition
    paths-ignore:
      - "proofreading/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-docx:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proofreading branch
        uses: actions/checkout@v4
        with:
          ref: iteration/proofreading-edition
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install document dependencies
        run: python -m pip install --upgrade pillow python-docx
      - name: Build editable Word document
        run: python tools/build_proofreading_docx.py
      - name: Commit generated proofreading edition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proofreading/The_Lasso_of_Time_Proofreading.docx
          git commit -m "Build illustrated proofreading edition" || echo "No document changes to commit"
          git push origin iteration/proofreading-edition
